name: Deploy Sutra to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sutra-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy existing production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "3ecd048ec38302f3c4718c485b0e76d5"
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js for Cloudflare CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run test suite
        run: bun run test

      - name: Run lint
        run: bun run lint

      - name: Build production application
        run: bun run build

      - name: Verify Cloudflare token and existing Worker secret access
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::GitHub Actions secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/bizsathi-migration/secrets" \
            -o "$response"
          jq -e '.success == true' "$response" >/dev/null
          for name in \
            GOOGLE_GENERATIVE_AI_API_KEY \
            GOOGLE_SERVICE_ACCOUNT_JSON \
            INVENTORY_SYNC_SECRET \
            SUPABASE_PUBLISHABLE_KEY \
            SUPABASE_SERVICE_ROLE_KEY \
            SUPABASE_URL; do
            jq -e --arg name "$name" '.result | any(.[]; .name == $name)' "$response" >/dev/null || {
              echo "::error::Expected existing Worker secret binding is missing before deployment: $name"
              exit 1
            }
          done
          echo "Cloudflare authentication and all six existing secret bindings verified before deployment."

      - name: Deploy to the existing Worker while preserving its secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '{}' > /tmp/keep-existing-worker-secrets.json
          ./node_modules/.bin/cf deploy --force --secrets-file /tmp/keep-existing-worker-secrets.json

      - name: Verify all existing production secret bindings remain present
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/bizsathi-migration/secrets" \
            -o "$response"
          jq -e '.success == true' "$response" >/dev/null
          for name in \
            GOOGLE_GENERATIVE_AI_API_KEY \
            GOOGLE_SERVICE_ACCOUNT_JSON \
            INVENTORY_SYNC_SECRET \
            SUPABASE_PUBLISHABLE_KEY \
            SUPABASE_SERVICE_ROLE_KEY \
            SUPABASE_URL; do
            jq -e --arg name "$name" '.result | any(.[]; .name == $name)' "$response" >/dev/null || {
              echo "::error::Expected Worker secret binding is missing after deployment: $name"
              exit 1
            }
          done
          echo "All six existing secret bindings remain present."

      - name: Smoke test production dashboard
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --output /dev/null \
            "https://bizsathi-migration.auraluxe26.workers.dev/dashboard"
          echo "Production dashboard responded successfully."
