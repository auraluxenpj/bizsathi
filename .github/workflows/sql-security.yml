name: Isolated SQL security validation

on:
  # Keep this filter aligned with main so migration-branch PRs run this security suite.
  pull_request:
    branches: [main, migration/cloudflare-workers-v2]
    paths:
      - "drizzle/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/sql-security.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-supabase:
    name: Replay migrations and run Stage 1/2 SQL security tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Start isolated local Supabase stack
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: Apply early test-only compatibility bootstrap
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n1)"
          test -n "${DB_CONTAINER}" || { echo "Local Supabase database container was not found"; exit 1; }
          docker exec -i "${DB_CONTAINER}" psql -U postgres -d postgres --no-psqlrc --set ON_ERROR_STOP=1 < .github/scripts/sql-replay-bootstrap.sql

      - name: Replay repository SQL migrations in a disposable local database
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n1)"
          test -n "${DB_CONTAINER}" || { echo "Local Supabase database container was not found"; exit 1; }
          while IFS= read -r migration; do
            echo "::group::Applying ${migration}"
            docker exec -i "${DB_CONTAINER}" psql -U postgres -d postgres --no-psqlrc --set ON_ERROR_STOP=1 < "${migration}"
            echo "::endgroup::"
            if [[ "${migration}" == "drizzle/migrations/0000_migration.sql" ]]; then
              echo "::group::Applying test-only payment-account baseline after core schema"
              docker exec -i "${DB_CONTAINER}" psql -U postgres -d postgres --no-psqlrc --set ON_ERROR_STOP=1 < .github/scripts/sql-payment-accounts-bootstrap.sql
              echo "::endgroup::"
            fi
          done < <(find drizzle/migrations -maxdepth 1 -type f -name '*.sql' -print | sort)

      - name: Run Stage 1 and Stage 2 SQL security regression tests
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n1)"
          test -n "${DB_CONTAINER}" || { echo "Local Supabase database container was not found"; exit 1; }
          for test_file in \
            supabase/tests/business_ownership_boundary.sql \
            supabase/tests/business_archive_approval.sql \
            supabase/tests/branch_manager_authority.sql \
            supabase/tests/sale_return_approval.sql \
            supabase/tests/hrm_security.sql \
            supabase/tests/multi_role_access_foundation.sql \
            supabase/tests/branch_manager_role_delegation.sql \
            supabase/tests/invitation_rpc_privileges.sql \
            supabase/tests/payment_accounts.sql \
            supabase/tests/cashier_rls.sql \
            supabase/tests/website_inventory_reservations.sql \
            supabase/tests/auraluxe_catalogue_authority.sql \
            supabase/tests/auraluxe_catalogue_mapping_persistence.sql \
            supabase/tests/rental_property_management.sql; do
            echo "::group::Running ${test_file}"
            docker exec -i "${DB_CONTAINER}" psql -U postgres -d postgres --no-psqlrc --set ON_ERROR_STOP=1 < "${test_file}"
            echo "::endgroup::"
          done

      - name: Stop isolated Supabase stack
        if: always()
        continue-on-error: true
        run: supabase stop --no-backup
