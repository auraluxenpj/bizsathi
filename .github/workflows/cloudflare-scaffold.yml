name: Cloudflare migration validation

on:
  push:
    branches:
      - migration/cloudflare-workers-v2

permissions:
  contents: write

concurrency:
  group: cloudflare-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies and refresh lockfile
        run: bun install

      - name: Commit lockfile updates when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Bun lockfile is current."
          else
            git commit -m "chore: refresh Bun lockfile"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push
          fi

      - name: Build for Cloudflare Workers
        run: bun run build

      - name: Validate Cloudflare deployment package without uploading
        run: bunx cf deploy --dry-run

      - name: Run application test suite
        run: bun run test
