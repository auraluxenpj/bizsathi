name: Cloudflare migration validation

on:
  push:
    branches:
      - migration/cloudflare-workers-v2

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install current locked dependencies
        run: bun install --frozen-lockfile

      - name: Replace Lovable build adapter with Cloudflare
        run: |
          bun remove @lovable.dev/vite-tanstack-config nitro
          bun add --dev cf @cloudflare/vite-plugin@beta

      - name: Commit the regenerated Bun lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo "Dependency manifest and lockfile are already current."
          else
            git commit -m "build: replace Lovable Nitro adapter with Cloudflare"
            git push
          fi

      - name: Build for Cloudflare Workers
        run: bun run build

      - name: Validate Cloudflare deployment package without uploading
        run: bunx cf deploy --dry-run

      - name: Run application test suite
        run: bun run test
