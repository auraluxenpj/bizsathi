name: Cloudflare migration scaffold

on:
  push:
    branches:
      - migration/cloudflare-workers-v2

permissions:
  contents: write

jobs:
  scaffold:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Let Cloudflare configure this existing Vite project
        run: bunx --yes cf init .

      - name: Commit only the generated Cloudflare scaffold
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock vite.config.ts cloudflare.config.ts .gitignore
          if git diff --cached --quiet; then
            echo "Cloudflare init produced no tracked changes."
          else
            git commit -m "chore: scaffold Cloudflare Workers configuration"
            git push
          fi
