name: Cloudflare migration scaffold

on:
  push:
    branches:
      - migration/cloudflare-workers-v2

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Inspect Lovable Vite wrapper contract
        run: |
          echo "--- README"
          sed -n '1,220p' node_modules/@lovable.dev/vite-tanstack-config/README.md
          echo "--- Type declarations"
          sed -n '1,260p' node_modules/@lovable.dev/vite-tanstack-config/dist/index.d.ts
          echo "--- Current Vite config"
          cat vite.config.ts
          echo "--- Relevant package dependencies"
          node -e "const p=require('./package.json'); console.log(JSON.stringify({dependencies:p.dependencies,devDependencies:p.devDependencies},null,2))"
