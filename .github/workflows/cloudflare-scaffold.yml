name: Cloudflare migration scaffold

on:
  push:
    branches:
      - migration/cloudflare-workers-v2

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Inspect resolved Vite plugins from the Lovable wrapper
        run: |
          node --input-type=module <<'NODE'
          import { defineConfig } from "@lovable.dev/vite-tanstack-config";
          const resolve = defineConfig({ tanstackStart: { server: { entry: "server" } } });
          const config = await resolve({ command: "build", mode: "production", isSsrBuild: false, isPreview: false });
          console.log(JSON.stringify({
            keys: Object.keys(config),
            plugins: (config.plugins ?? []).map(plugin => Array.isArray(plugin) ? plugin.map(p => p?.name) : plugin?.name),
            resolve: config.resolve,
            server: config.server,
            build: config.build,
            ssr: config.ssr
          }, null, 2));
          NODE
          echo "--- README and config type contract"
          sed -n '1,180p' node_modules/@lovable.dev/vite-tanstack-config/README.md
          sed -n '1,220p' node_modules/@lovable.dev/vite-tanstack-config/dist/index.d.ts
          echo "--- Current Vite config"
          cat vite.config.ts
